[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mesh-ready-check"
version = "0.1.0"
description = "AI가 생성한 3D 메시를 게임·웹 자산으로 쓸 수 있는지 자동 검사"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "trimesh>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pillow>=10"]

[project.scripts]
mesh-ready-check = "mesh_ready_check.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mesh_ready_check"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.isort]
known-first-party = ["mesh_ready_check", "meshes"]
