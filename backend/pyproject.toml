[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "draw2world-backend"
version = "0.1.0"
description = "Draw2World AI API 서버와 워커"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "numpy>=1.24",
    "pillow>=10",
    "opencv-python-headless>=4.9",
    "scipy>=1.10",
    "trimesh>=4.0",
    "shapely>=2.0",
    "mapbox-earcut>=1.0",
    "fast-simplification>=0.1.7",
    "mesh-ready-check",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "pyyaml>=6"]
# EDIT_PLANNER=claude일 때만 필요
llm = ["anthropic>=0.80"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "mesh_ready_check", "images"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: GPU와 실제 모델 가중치가 필요한 테스트 (CI 제외)"]
addopts = "-m 'not gpu'"
